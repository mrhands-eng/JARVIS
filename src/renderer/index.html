<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' data: blob:; img-src 'self' data: blob:" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud" class="hud">
      <header class="top">
        <div class="brand">
          <span class="reactor"></span>
          <div>
            <div class="title">J.A.R.V.I.S.</div>
            <div id="status" class="status">STANDBY</div>
            <div id="activity" class="activity">ожидание</div>
          </div>
        </div>
        <div class="controls">
          <button id="btnBrain" class="brain-btn" title="Переключить Cursor ↔ локальный ИИ">CURSOR</button>
          <button id="btnStop" class="stop-btn hidden" title="Остановить текущую задачу (Ctrl+Shift+X)">STOP</button>
          <button id="btnMute" title="Отключить озвучку (новые ответы)">🔊</button>
          <button id="btnSilence" class="silence-btn" title="Замолчать сейчас — остановить текущую озвучку">TTS⏹</button>
          <button id="btnMic" title="Push to talk">🎤</button>
        </div>
      </header>

      <div class="hud-layout">
        <div class="hud-main">
      <div id="remindersHud" class="reminders-hud" aria-live="polite">
        <form id="timerForm" class="timer-form" title="Таймер / напоминание">
          <span class="timer-form-icon">⏱</span>
          <input id="timerMsg" type="text" class="timer-msg" placeholder="Текст…" maxlength="120" autocomplete="off" />
          <input id="timerMin" type="number" class="timer-min" min="1" max="2880" value="5" title="Минуты" aria-label="Минуты" />
          <span class="timer-unit">мин</span>
          <div class="timer-presets">
            <button type="button" class="timer-preset" data-min="5">5</button>
            <button type="button" class="timer-preset" data-min="10">10</button>
            <button type="button" class="timer-preset" data-min="15">15</button>
            <button type="button" class="timer-preset" data-min="30">30</button>
          </div>
          <button type="submit" class="timer-go">Старт</button>
        </form>
        <div id="remindersActive" class="reminders-active hidden">
          <button type="button" id="remindersToggle" class="reminders-summary" title="Ближайшие напоминания — развернуть">
            <span class="reminders-icon">⏰</span>
            <span id="remindersSummaryText" class="reminders-summary-text"></span>
            <span id="remindersChevron" class="reminders-chevron">▾</span>
          </button>
          <ul id="remindersList" class="reminders-list hidden"></ul>
        </div>
      </div>

      <div id="log" class="log"></div>

      <div id="confirm" class="confirm hidden">
        <div id="confirmText" class="confirm-text"></div>
        <div class="confirm-actions">
          <button id="btnYes">Confirm</button>
          <button id="btnNo" class="danger">Cancel</button>
        </div>
        <div class="hint">Ctrl+Shift+Y / Ctrl+Shift+N</div>
      </div>

      <div id="liveVoice" class="live-voice hidden" aria-live="polite" title="Распознавание в реальном времени"></div>

      <form id="form" class="composer">
        <input id="input" type="text" placeholder="Ask JARVIS… (Ctrl+Shift+J = voice)" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
      <footer class="foot">Stark OS · STOP = Ctrl+Shift+X · Ctrl+Shift+H = HUD</footer>
        </div>

        <aside id="opsRail" class="ops-rail" aria-label="Системные операции">
          <div class="ops-head">
            <span class="ops-title">СИСТЕМА</span>
            <button type="button" id="opsCollapse" class="ops-collapse" title="Свернуть панель">◂</button>
          </div>
          <div id="opsBody" class="ops-body"></div>
        </aside>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
