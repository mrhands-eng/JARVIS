<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Stark HUD Wallpaper</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#05080F; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();
const nodes = Array.from({length:48},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.0003,vy:(Math.random()-0.5)*0.0003}));
function frame(t){
  const w=canvas.width,h=canvas.height;
  ctx.fillStyle='#05080F'; ctx.fillRect(0,0,w,h);
  const g=ctx.createRadialGradient(w*0.7,h*0.35,0,w*0.7,h*0.35,Math.max(w,h)*0.55);
  g.addColorStop(0,'rgba(0,229,255,0.12)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // grid
  ctx.strokeStyle='rgba(0,229,255,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  // arcs
  ctx.strokeStyle='rgba(0,229,255,0.35)';
  ctx.beginPath(); ctx.arc(w*0.18,h*0.78,90+Math.sin(t/900)*8,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(w*0.18,h*0.78,60, t/800, t/800+Math.PI*1.2); ctx.stroke();
  // nodes
  for(const n of nodes){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>1)n.vx*=-1; if(n.y<0||n.y>1)n.vy*=-1; }
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      const dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
      if(d<0.18){ ctx.strokeStyle=`rgba(0,229,255,${(0.18-d)*1.2})`; ctx.beginPath(); ctx.moveTo(a.x*w,a.y*h); ctx.lineTo(b.x*w,b.y*h); ctx.stroke(); }
    }
  }
  for(const n of nodes){ ctx.fillStyle='#00E5FF'; ctx.beginPath(); ctx.arc(n.x*w,n.y*h,2,0,Math.PI*2); ctx.fill(); }
  // label
  ctx.fillStyle='rgba(0,229,255,0.55)'; ctx.font='12px Consolas'; ctx.fillText('STARK OS // ARC REACTOR GRID', 24, 32);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
